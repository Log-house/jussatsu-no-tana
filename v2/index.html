<!DOCTYPE html>
<html lang="ja" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>十冊の棚 — デザイン試作 v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
/* デザイン試作 v2：暗い背景（夜）と明るい背景（昼）を切り替えて見比べる。
   背表紙はカバーを外した古いハードカバー（布装＋箔押し）の質感。棚板は木の気配を少しだけ。 */
:root{
  --display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --ui:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
:root[data-theme="night"]{
  --bg:#111419; --bg2:#161a21; --ink:#E6E2D8; --muted:#8E949C; --line:#262B33;
  --paper:#1A1E25; --accent:#C9B27A;
  --wall:linear-gradient(180deg,rgba(0,0,0,.42),rgba(0,0,0,.12) 40%,rgba(0,0,0,0));
  --wood1:#3A2A1F; --wood2:#4A3626; --woodTop:#6A4E38;
  color-scheme:dark;
}
:root[data-theme="day"]{
  --bg:#EEEAE2; --bg2:#E7E2D8; --ink:#2A2620; --muted:#7A7369; --line:#D6CFC2;
  --paper:#F6F3EC; --accent:#8A6A2E;
  --wall:linear-gradient(180deg,rgba(60,40,20,.16),rgba(60,40,20,.04) 40%,rgba(0,0,0,0));
  --wood1:#9C7A55; --wood2:#B08B63; --woodTop:#C9A57C;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);line-height:1.8;font-size:15px;
  transition:background-color .4s ease,color .4s ease}
/* 夜：ごく淡い星の気配 */
:root[data-theme="night"] body{
  background-image:
    radial-gradient(1px 1px at 12% 18%,rgba(255,255,255,.18),transparent 60%),
    radial-gradient(1px 1px at 68% 9%,rgba(255,255,255,.14),transparent 60%),
    radial-gradient(1px 1px at 84% 34%,rgba(255,255,255,.12),transparent 60%),
    radial-gradient(1px 1px at 33% 52%,rgba(255,255,255,.10),transparent 60%),
    radial-gradient(1px 1px at 91% 71%,rgba(255,255,255,.12),transparent 60%),
    radial-gradient(1px 1px at 7% 83%,rgba(255,255,255,.10),transparent 60%),
    radial-gradient(1200px 600px at 50% -10%,#1b2030,transparent 70%);
  background-attachment:fixed;
}
a{color:inherit}

/* ヘッダー：サイト名は小さく、メニューは3語 */
header.site{display:flex;align-items:center;justify-content:space-between;gap:16px;
  max-width:1180px;margin:0 auto;padding:22px 24px 8px}
.logo{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.32em;text-decoration:none}
nav.menu{display:flex;align-items:center;gap:22px;font-size:13px;letter-spacing:.12em}
nav.menu a{text-decoration:none;color:var(--muted)}
nav.menu a:hover,nav.menu a:focus-visible{color:var(--ink);outline:none}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.toggle button{all:unset;cursor:pointer;font-size:12px;padding:2px 12px;color:var(--muted)}
.toggle button[aria-pressed="true"]{background:var(--line);color:var(--ink)}
.toggle button:focus-visible{outline:2px solid var(--accent)}

/* 棚の一覧：広い画面では2列に並べ、密度を出す */
main{max-width:1180px;margin:0 auto;padding:18px 24px 40px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(520px,1fr));gap:30px 56px;align-items:start}
section.shelf{display:grid;grid-template-columns:34px 1fr;gap:0 10px}
.label{writing-mode:vertical-rl;font-family:var(--display);font-size:16px;letter-spacing:.3em;
  align-self:end;padding-bottom:22px;white-space:nowrap}
.label .no{font-size:11px;color:var(--muted);letter-spacing:.1em;margin-bottom:.8em;font-family:var(--ui);
  text-combine-upright:all}
.case{min-width:0}
.rack{position:relative;overflow-x:auto;overflow-y:hidden;padding-top:26px;scrollbar-width:thin}
.rack::before{content:"";position:absolute;inset:0 0 0 0;background:var(--wall);pointer-events:none}
.row{position:relative;display:flex;align-items:flex-end;gap:2px;min-width:max-content;padding:0 10px}
.board{height:13px;border-radius:1px;position:relative;
  background:
    repeating-linear-gradient(90deg,rgba(0,0,0,.0) 0 7px,rgba(0,0,0,.07) 7px 8px,rgba(0,0,0,0) 8px 19px,rgba(255,255,255,.04) 19px 20px),
    linear-gradient(180deg,var(--woodTop) 0 2px,var(--wood2) 2px,var(--wood1));
  box-shadow:0 10px 14px -8px rgba(0,0,0,.55)}

/* 背表紙：布装のハードカバー。細かい織り目、丸背の陰影、箔押しの書名と天地の飾り罫 */
button.spine{all:unset;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;
  border-radius:3px 3px 1px 1px;padding:18px 0 12px;
  background-image:
    repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 2px),
    repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 1px,transparent 1px 2px),
    linear-gradient(90deg,rgba(0,0,0,.32),rgba(255,255,255,.10) 22%,rgba(255,255,255,.03) 45%,rgba(0,0,0,.08) 75%,rgba(0,0,0,.34));
  box-shadow:0 0 0 1px rgba(0,0,0,.25) inset, 2px 0 3px rgba(0,0,0,.25);
  transition:transform .28s cubic-bezier(.2,.7,.2,1), filter .28s ease}
button.spine::before,button.spine::after{content:"";position:absolute;left:18%;right:18%;height:3px;
  border-top:1px solid var(--foil);border-bottom:1px solid var(--foil);opacity:.55}
button.spine::before{top:8px}
button.spine::after{bottom:30px}
button.spine:hover{transform:translateY(-6px)}
button.spine[aria-pressed="true"]{transform:translateY(-18px);filter:brightness(1.08)}
button.spine:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.spine .t{writing-mode:vertical-rl;font-family:var(--display);font-weight:600;letter-spacing:.08em;line-height:1.25;
  flex:1;overflow:hidden;color:var(--foil);text-shadow:0 1px 0 rgba(0,0,0,.35),0 -1px 0 rgba(255,255,255,.08)}
.spine .mk{font-family:var(--display);font-size:10px;line-height:1;margin-top:10px;color:var(--foil);opacity:.8;
  border:1px solid var(--foil);border-radius:50%;width:16px;height:16px;display:grid;place-items:center}

/* 解説カード：棚の下に開く */
.card{overflow:hidden;max-height:0;opacity:0;transition:max-height .45s ease,opacity .3s ease,margin .3s ease}
.card.open{max-height:1400px;opacity:1;margin-top:18px}
.card-in{position:relative;padding:22px 24px 20px;background:var(--paper);border:1px solid var(--line);border-radius:3px}
.close{all:unset;cursor:pointer;position:absolute;top:10px;right:14px;font-size:20px;color:var(--muted);line-height:1;padding:4px}
.close:focus-visible{outline:2px solid var(--accent)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);letter-spacing:.1em}
.chip i{display:inline-block;width:9px;height:14px;border-radius:1px}
.card h3{font-family:var(--display);font-weight:600;font-size:22px;margin:6px 0 2px;line-height:1.5;text-wrap:balance}
.meta{margin:0 0 14px;font-size:13px;color:var(--muted)}
.meta .tbd{border-bottom:1px dotted var(--muted)}
.card h4{margin:0 0 4px;font-size:11px;font-weight:500;letter-spacing:.14em;color:var(--muted)}
.copy{margin:0 0 16px;padding:10px 14px;border-left:2px solid var(--line);font-size:13px;color:var(--muted)}
.copy p{margin:0}
.desc{font-family:var(--display);font-size:15.5px;line-height:2;max-width:34em}
.desc p{margin:0}.desc p+p{margin-top:.6em}
.ai{margin:6px 0 16px;font-size:11px;color:var(--muted)}
.buy{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.buy a{font-size:13px;text-decoration:none;border:1px solid var(--line);border-radius:2px;padding:4px 14px}
.buy a:hover,.buy a:focus-visible{border-color:var(--accent);color:var(--accent);outline:none}
.buy small{font-size:11px;color:var(--muted)}
details.log{margin-top:16px;border-top:1px dashed var(--line);padding-top:10px;font-size:13px}
details.log summary{cursor:pointer;color:var(--muted);font-size:12px;letter-spacing:.08em}
details.log dl{display:grid;grid-template-columns:9em 1fr;gap:3px 12px;margin:10px 0 0}
details.log dt{color:var(--muted)} details.log dd{margin:0;font-variant-numeric:tabular-nums}
.sample{font-size:10px;border:1px dashed var(--muted);color:var(--muted);border-radius:2px;padding:0 5px;margin-left:6px}
.pn{display:flex;gap:8px;margin-top:14px}
.pn button{font:inherit;font-size:12px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:2px;padding:2px 12px;cursor:pointer}
.pn button:disabled{opacity:.35;cursor:default}

footer{max-width:1180px;margin:20px auto 40px;padding:16px 24px 0;border-top:1px solid var(--line);font-size:11px;color:var(--muted);line-height:1.9}

/* スマホ：1列。カードは画面の下からせり上がる */
.scrim{display:none}
@media (max-width:600px){
  header.site{padding:16px 16px 4px}
  nav.menu{gap:12px;font-size:12px} nav.menu .opt{display:none}
  main{grid-template-columns:1fr;padding:10px 12px 30px;gap:26px}
  section.shelf{grid-template-columns:26px 1fr}
  .label{font-size:14px}
  .card{position:fixed;left:0;right:0;bottom:0;z-index:20;margin:0!important;max-height:0;transition:max-height .4s ease,opacity .3s}
  .card.open{max-height:78vh;overflow:auto}
  .card-in{border-radius:12px 12px 0 0;border-bottom:0;padding:22px 18px 28px}
  .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .3s;z-index:10}
  .scrim.on{opacity:1;pointer-events:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="site">
  <a class="logo" href="#">十冊の棚</a>
  <nav class="menu" aria-label="メニュー">
    <a href="#">棚</a><a class="opt" href="#">選書の方法</a><a class="opt" href="#">この本屋について</a>
    <span class="toggle" role="group" aria-label="背景の明るさ">
      <button type="button" data-t="night" aria-pressed="true">夜</button><button type="button" data-t="day" aria-pressed="false">昼</button>
    </span>
  </nav>
</header>

<main id="shelves"></main>
<div class="scrim" id="scrim"></div>

<footer>

</footer>

 {id:"china", name:"中国", intro:"歴史、思想、経済、現代社会、そしてSFと漫画。隣の大国を多面的に知る十冊。", books:[
  ["中国の論理", "岡本隆司", "入口", "中国のニュースを見て「なぜそう考えるのか」と戸惑ったことはないだろうか。本書は、その違和感の正体を歴史からたどる。社会が一握りの上層とその他大勢とに分かれてきたこと、自らを世界の中心に置く「中華」の発想がいまの政治や外交にまでつながっていることを、近代中国史の研究者が平易に解き明かす。個々の事件より、事件の背後にある考え方の型をつかむことに重きを置いた本だ。\nこの棚の一冊目に置いたのは、残りの九冊を読むための地図になるからだ。ここで中国の考え方の骨組みをつかんでおくと、『論語』の言葉の重みも、『八九六四』で語られる人々の沈黙も、違って見えてくる。新書一冊で読み切れる分量なのも、入口としてありがたい。", 240, "新書"],
  ["中国経済講義", "梶谷懐", "仕組み", "GDPの数字は信用できるのか、不動産バブルははじけるのか。楽観論と悲観論が極端に分かれがちな中国経済を、研究者がデータと経済学の考え方で冷静に検討する。統計の信頼性、地方政府と不動産、金融のリスクなどを一つずつ取り上げる講義形式なので、順に読めば全体像が自然と頭に入る。わかっていることと、わかっていないことを分けて示す姿勢は、ニュースの読み方の練習にもなる。\n棚では「仕組み」の枠を担う。歴史や思想の本が中国の考え方を教えてくれるなら、本書は中国がいま実際にどう動いているのかを、お金の流れから見せてくれる。数式はほとんど出てこないので、経済学になじみがなくても読める。", 260, "新書"],
  ["八九六四", "安田峰俊", "社会", "1989年の天安門事件を、当時を知る人々はどう記憶し、その後どう生きてきたのか。中国国内ではいまもほとんど語ることが許されない事件だ。著者は運動の中心にいた元学生から、国を離れた人、今は語りたがらない人まで訪ね歩き、事件への思いが立場によって大きく異なることを描き出す。英雄譚にも単純な告発にもならないところに、本書の誠実さがある。\n棚では「社会」の枠に置いた。経済成長を遂げた国で、人々は政治とどう折り合いをつけて生きているのか。統計ではなく生身の言葉で迫る一冊だ。『ワイルド・スワン』と合わせて読むと、20世紀後半の中国がより立体的に見えてくる。読後、ニュースで見る中国の人々の表情が少し違って見えるはずだ。", 320, "四六判"],
  ["物語 中国の歴史", "寺田隆信", "歴史", "殷・周から秦・漢、隋・唐、宋、元、明、そして近代の入口へ。三千年を超える歴史を新書一冊でたどる通史だ。細かな年号より、王朝が交代しても受け継がれた文字や官僚制、皇帝を中心とする統治といった、文明の骨格に光が当てられている。王朝の盛衰を物語として追えるので、歴史が苦手でも読み進めやすい。\n棚では「歴史」の枠を担う。『キングダム』の戦国の世がその後どこへ向かったのか、『論語』の思想がどう国を支えてきたのか。ほかの本で出会った時代や人物をこの一冊の年表に置き直すと、点と点がつながっていく。棚の中で、いちばん行ったり来たりしながら読みたい本だ。人物や事件を調べ直したいときの手引きにもなる。", 330, "新書"],
  ["論語", "孔子", "古典", "「学びて時に之を習う、亦た説ばしからずや」で始まる、孔子と弟子たちの言葉を、のちの人々がまとめた古典。二千年以上にわたり、日本を含む東アジアの教養の土台であり続けてきた。短い章が脈絡なく並ぶので、頭から順に読むより、気になった言葉に立ち止まり、注釈を頼りに考える読み方が向いている。孔子が理想とした「礼」や「仁」は、家族や上下関係を重んじる価値観として、いまも形を変えて生きている。\n棚では「古典」の枠に置いた。『中国の論理』が語る考え方の源流をたどると、その多くがここに行き着く。一方で、魯迅が『狂人日記』で激しく批判したのも、この教えを絶対とした古い社会だった。称える読み方と疑う読み方の両方を知ると、二千年の重みが実感できる。", 400, "文庫"],
  ["ワイルド・スワン", "ユン・チアン", "体験", "軍閥の将軍の妾となった祖母、共産党の幹部として革命に身を投じた母、紅衛兵の時代を経て英国へ渡った著者。三代の女性の人生を通して、20世紀中国の激動を描いた家族の記録だ。纏足の痛み、戦争と内戦、新しい国への期待、そして文化大革命の嵐。世界的なベストセラーになったが、中国本土では出版が認められていない。\n棚では「体験」の枠を担う。『物語 中国の歴史』が文明の大きな流れを描くなら、本書はその流れの中を生きた個人の時間を描く。教科書では数行で済む出来事の重さが、家族の目線で迫ってくる。分量は多いが、一気に読ませる力がある。『三体』の冒頭で描かれる文化大革命の場面も、読後には違って見えるはずだ。", 900, "文庫"],
  ["阿Q正伝・狂人日記", "魯迅", "物語", "仙台で医学を学んでいた魯迅は、人々の体より心を変えるべきだと考え、文学に転じた。周りの人々が自分を食べようとしていると思い込む男の日記『狂人日記』、負けても頭の中で勝ったことにしてやり過ごす男を描いた『阿Q正伝』。どちらも古い社会と人々の心のありようを鋭く突いた、近代中国文学の出発点だ。どちらも短く、百年前の作品とは思えないほど読みやすい。\n棚では「物語」の枠に置いた。『論語』に代表される伝統が、近代の入口でどれほど激しく問い直されたかを、小説として体験できる。阿Qのような人物は、いまの私たちのまわりにもいないだろうか。そう考えると、百年前の問いが現在形で響いてくる。", 250, "文庫"],
  ["三体", "劉慈欣", "物語", "文化大革命のさなか、父を殺された若い女性科学者が、極秘の研究施設で下した一つの決断。それが数十年後、人類全体の運命を揺るがしていく。英語版はアジアの作家として初めてヒューゴー賞の長編部門を受賞し、世界的なベストセラーになった長編SFだ。三部作の第一作で、続編ではさらにスケールが広がる。\n棚では「物語」の枠に置いた。物理学に裏打ちされた壮大なスケールと、謎が謎を呼ぶ展開で、現代中国のエンターテインメント小説の実力を体感できる。歴史の傷が物語の出発点になっている点にも注目したい。『ワイルド・スワン』を読んでから開くと、冒頭の場面の重みがまるで違って感じられる。", 450, "四六判"],
  ["キングダム", "原泰久", "漫画", "紀元前3世紀、七つの国が覇を競った中国の戦国時代。戦争孤児の少年・信が、のちの始皇帝である秦の若き王・嬴政と出会い、天下の大将軍を目指して戦場を駆け上がる。史書に数行しか残らない武将たちにも大胆な想像力で血を通わせ、国を一つにするとはどういうことかを問いかける歴史漫画だ。2006年に連載が始まり、アニメや実写映画にもなった。\n棚では「漫画」の枠に置いた。これほど多くの読者を中国史へ引き込んだ作品は、そう多くない。読み終えたら『物語 中国の歴史』を開き、秦の統一がその後に何を残したのかを確かめてみてほしい。物語と史実の距離を測る楽しみが生まれる。合戦の迫力と、敵味方を問わない武将たちの生き様もたっぷり味わいたい。", 200, "B6判コミック"],
  ["中華料理の文化史", "張競", "変化球", "麻婆豆腐に欠かせない唐辛子は、アメリカ大陸の原産で、中国に広まったのはそれほど古い時代ではない。私たちが知る中華料理の多くは、外からの食材や調理法を取り込みながら形づくられてきた。本書はその変化を古い文献からたどり、食卓の背後に王朝の交代や異民族との交流を浮かび上がらせる。何を食べ、どう調理してきたかという身近な問いから入るので、歴史の本としても読みやすい。\n棚では「変化球」の枠に置いた。政治や思想とは別の入口から眺めると、中国の歴史が毎日の食卓につながる話に変わる。重いテーマの多いこの棚で、肩の力を抜いて読める一冊だ。ほかの九冊の合間にはさんでほしい。読みながら何度もお腹が空くだろう。", 270, "文庫"]
 ]},

// 判型ごとの天地（mm）
const FORMAT_MM = {"小型絵本":140,"B6判":182,"絵本":250,"文庫":148,"新書":173,"新書判コミック":173,"B6判コミック":182,"四六判":188,"A5判":210};

const SHORT = {
  "がんになった緩和ケア医が語る「残り2年」の生き方、考え方":"「残り2年」の生き方、考え方",
  "東京タワー オカンとボクと、時々、オトン":"東京タワー",
  "ぼくはイエローでホワイトで、ちょっとブルー":"ぼくはイエローでホワイトで、ちょっとブルー",
  "雇用、利子および貨幣の一般理論":"雇用・利子および貨幣の一般理論"
};



// 旧9区分 → 新6枠（仮称）
const MAP = {"入口":"入門","仕組み":"探究","社会":"探究","歴史":"探究","古典":"古典","物語":"物語","漫画":"物語","体験":"人物","変化球":"寄道"};
// 布装の色（くすませた6色）と箔の色
const CLOTH = {
  "入門":{bg:"#C3B48E", foil:"#3B3022"},
  "探究":{bg:"#2E3E55", foil:"#D9C48E"},
  "古典":{bg:"#6A2A2A", foil:"#DCC58C"},
  "物語":{bg:"#2D4838", foil:"#D6C28C"},
  "人物":{bg:"#6A4A33", foil:"#E0CB95"},
  "寄道":{bg:"#9A7E3E", foil:"#2F2616"}
};
const pad = n => String(n).padStart(2,"0");
const hash = s => [...s].reduce((h,c)=>(h*31+c.codePointAt(0))>>>0,7);

const main=document.getElementById("shelves");
const scrim=document.getElementById("scrim");
let closeCurrent=null;
scrim.addEventListener("click",()=>closeCurrent&&closeCurrent());
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&closeCurrent)closeCurrent();});

SHELVES.forEach((shelf,si)=>{
  const sec=document.createElement("section");
  sec.className="shelf"; sec.id=shelf.id;
  sec.innerHTML=`<div class="label"><span class="no">${pad(si+1)}</span>${shelf.name}</div>
    <div class="case"><div class="rack"><div class="row" role="group" aria-label="${shelf.name}の棚"></div></div><div class="board"></div>
    <div class="card" aria-live="polite"></div></div>`;
  main.appendChild(sec);
  const row=sec.querySelector(".row"), card=sec.querySelector(".card");
  const spines=[];
  shelf.books.forEach((b,bi)=>{
    const [title,author,old]=b; const role=MAP[old]; const c=CLOTH[role];
    const label=SHORT[title]||title;
    const fmt=b[5]||FORMAT[title], pgs=b[4]||PAGES[title];
    const h=Math.round((FORMAT_MM[fmt]||188)*1.4);
    const area=h-58;
    const pw=Math.max(26,Math.min(70,20+(pgs||300)*0.046));
    let fs=14, cols=Math.max(1,Math.floor((pw-10)/(fs*1.3)));
    while(label.length*fs*1.1>area*cols && fs>10.5){fs-=0.5; cols=Math.max(1,Math.floor((pw-10)/(fs*1.3)));}
    const need=Math.ceil(label.length*fs*1.1/area);
    const w=Math.max(pw, need*fs*1.3+10);
    const btn=document.createElement("button");
    btn.className="spine"; btn.type="button";
    btn.style.cssText=`height:${h}px;width:${w}px;background-color:${c.bg};--foil:${c.foil}`;
    btn.setAttribute("aria-pressed","false");
    btn.setAttribute("aria-label",`${title}（${role}）`);
    btn.innerHTML=`<span class="t" style="font-size:${fs}px">${label}</span><span class="mk" aria-hidden="true">${role[0]}</span>`;
    btn.addEventListener("click",()=>{ btn.getAttribute("aria-pressed")==="true" ? close() : open(bi); });
    row.appendChild(btn); spines.push(btn);
  });
  function close(){
    spines.forEach(s=>s.setAttribute("aria-pressed","false"));
    card.classList.remove("open"); scrim.classList.remove("on"); closeCurrent=null;
  }
  function open(i){
    if(closeCurrent && closeCurrent!==close) closeCurrent();
    const [title,author,old,desc]=shelf.books[i]; const role=MAP[old]; const c=CLOTH[role];
    const hh=hash(title);
    spines.forEach((s,k)=>s.setAttribute("aria-pressed",k===i?"true":"false"));
    card.innerHTML=`<div class="card-in">
      <button class="close" type="button" aria-label="閉じる">×</button>
      <span class="chip"><i style="background:${c.bg}"></i>${role}</span>
      <h3>${title}</h3>
      <p class="meta">${author}　<span class="tbd">出版社</span>　<span class="tbd">原書の地域／年</span></p>
      <h4>出版社の内容紹介</h4>
      <div class="copy"><p>本番では、openBDから取得した版元の紹介文がここに入ります。（出典：版元ドットコム／openBD）</p></div>
      <h4>解説</h4>
      <div class="desc">${desc.split("\n").map(x=>`<p>${x}</p>`).join("")}</div>
      <p class="ai">AIが資料をもとに下書きし、編集者が確認・推敲しています。</p>
      <div class="buy"><a href="#" onclick="return false">書店で買う</a><a href="#" onclick="return false">図書館で探す</a><small>広告を含みます</small></div>
      <details class="log"><summary>選書の記録を見る</summary><dl>
        <dt>大学図書館の所蔵</dt><dd>${(400+hh%900).toLocaleString()}館<span class="sample">仮</span></dd>
        <dt>県立図書館の所蔵率</dt><dd>${30+(hh>>4)%70}%<span class="sample">仮</span></dd>
        <dt>新聞書評</dt><dd>${(hh>>8)%5}件<span class="sample">仮</span></dd>
        <dt>解説の根拠</dt><dd>内容紹介・目次による<span class="sample">仮</span></dd>
      </dl></details>
      <div class="pn"><button type="button" data-d="-1" ${i===0?"disabled":""}>前の本</button><button type="button" data-d="1" ${i===shelf.books.length-1?"disabled":""}>次の本</button></div>
    </div>`;
    card.classList.add("open");
    if(matchMedia("(max-width:600px)").matches) scrim.classList.add("on");
    closeCurrent=close;
    card.querySelector(".close").addEventListener("click",close);
    card.querySelectorAll(".pn button").forEach(nb=>nb.addEventListener("click",()=>{
      const n=i+Number(nb.dataset.d); open(n); spines[n].focus({preventScroll:true});
    }));
  }
});

// 夜／昼：最初は端末の設定に合わせ、選んだほうを次回も覚えておく
function setTheme(t,save){
  document.documentElement.dataset.theme=t;
  document.querySelectorAll(".toggle button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.t===t?"true":"false"));
  if(save){try{localStorage.setItem("theme",t);}catch(e){}}
}
let saved=null; try{saved=localStorage.getItem("theme");}catch(e){}
const mq=matchMedia("(prefers-color-scheme: dark)");
setTheme(saved||(mq.matches?"night":"day"),false);
mq.addEventListener("change",e=>{let s=null;try{s=localStorage.getItem("theme");}catch(_){} if(!s) setTheme(e.matches?"night":"day",false);});
document.querySelectorAll(".toggle button").forEach(b=>b.addEventListener("click",()=>setTheme(b.dataset.t,true)));
</script>
