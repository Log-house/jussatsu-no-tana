<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>十冊の棚</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* layout: 1テーマ=1段の本棚。背表紙を選ぶと、棚の下に解説カードが開く */
:root{
  --bg:#ECEEEF;
  --paper:#F7F8F8;
  --ink:#1B1F24;
  --muted:#5D656D;
  --accent:#27566B;
  --board:#3B2F27;
  --line:#D3D7DA;
  --display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15181B; --paper:#1D2125; --ink:#E7E9EB; --muted:#9AA2AA;
    --accent:#7FB3C8; --board:#6E5B4C; --line:#2D3338; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15181B; --paper:#1D2125; --ink:#E7E9EB; --muted:#9AA2AA;
  --accent:#7FB3C8; --board:#6E5B4C; --line:#2D3338; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.8;font-size:15px}
a{color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}

header.site{padding:48px 0 24px;border-bottom:1px solid var(--line)}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 20px}
.brand h1{font-family:var(--display);font-weight:800;font-size:40px;letter-spacing:.08em;margin:0;line-height:1.2}
.brand .tag{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:2px;padding:0 8px}
.concept{font-family:var(--display);font-size:20px;margin:14px 0 4px;letter-spacing:.06em;text-wrap:balance}
.lead{color:var(--muted);margin:0;max-width:40em}

nav.index{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 0;padding:0;list-style:none}
nav.index a{display:block;text-decoration:none;font-size:13px;padding:4px 12px;border:1px solid var(--line);border-radius:999px;background:var(--paper)}
nav.index a:hover,nav.index a:focus-visible{border-color:var(--accent);color:var(--accent);outline:none}
nav.index .no{font-variant-numeric:tabular-nums;color:var(--muted);margin-right:6px}

.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:18px 0 0;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:10px;height:14px;border-radius:1px}

section.shelf{padding:44px 0 8px}
.shelf-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;margin-bottom:6px}
.shelf-head .no{font-family:var(--display);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.1em}
.shelf-head h2{font-family:var(--display);font-size:28px;margin:0;letter-spacing:.06em;line-height:1.3}
.shelf-intro{margin:0 0 18px;color:var(--muted);max-width:40em}

.rack{overflow-x:auto;padding-top:20px}
.row{display:flex;align-items:flex-end;gap:3px;min-width:max-content;padding:0 12px}
.board{height:12px;background:var(--board);border-radius:1px;box-shadow:0 6px 10px -6px rgba(0,0,0,.35)}

button.spine{
  all:unset;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;
  border-radius:2px 2px 0 0;padding:14px 0;
  box-shadow:inset -3px 0 0 rgba(0,0,0,.12), inset 2px 0 0 rgba(255,255,255,.12);
  transition:transform .18s ease;
}
button.spine:hover{transform:translateY(-6px)}
button.spine[aria-pressed="true"]{transform:translateY(-16px)}
button.spine:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.spine .t{writing-mode:vertical-rl;font-family:var(--display);font-weight:700;letter-spacing:.06em;line-height:1.25;flex:1;overflow:hidden}

.card{display:grid;grid-template-columns:auto 1fr;gap:20px;margin:20px 0 0;padding:22px 24px;background:var(--paper);border:1px solid var(--line);border-radius:4px}
.card .chip{display:inline-block;font-size:12px;padding:1px 10px;border-radius:2px;font-weight:500}
.card .pos{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:10px}
.card h3{font-family:var(--display);font-size:22px;margin:8px 0 2px;line-height:1.45;text-wrap:balance}
.card .by{color:var(--muted);font-size:13px;margin:0 0 10px}
.card .spec{margin-left:12px;font-size:12px;font-variant-numeric:tabular-nums}
.card .desc{max-width:36em}
.card .copy{max-width:36em;margin:4px 0 18px;padding:12px 16px;background:var(--bg);border-left:3px solid var(--line);border-radius:2px}
.card .copy h4,.card h4.sec{margin:0 0 6px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.card .copy .ph{margin:0;font-size:13px;color:var(--muted)}
.card .copy .src{margin:6px 0 0;font-size:11px;color:var(--muted)}
.card .desc p{margin:0}
.card .desc p+p{margin-top:.8em}
.card .mini{width:46px;height:120px;border-radius:2px 2px 0 0;box-shadow:inset -3px 0 0 rgba(0,0,0,.12)}
.card .nav{display:flex;gap:8px;margin-top:14px}
.card .nav button{font:inherit;font-size:12px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:2px;padding:3px 12px;cursor:pointer}
.card .nav button:hover,.card .nav button:focus-visible{border-color:var(--accent);color:var(--accent);outline:none}

.process{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 6px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.process b{color:var(--ink);font-weight:500}
.process .arrow{opacity:.6}
.sample{display:inline-block;font-size:11px;border:1px dashed var(--muted);color:var(--muted);border-radius:2px;padding:0 6px;margin-left:6px;line-height:1.6}
.log{margin:16px 0 0;padding:14px 0 0;border-top:1px dashed var(--line)}
.log h4{margin:0 0 8px;font-size:13px;font-weight:700;letter-spacing:.04em}
.log dl{display:grid;grid-template-columns:8em 1fr;gap:4px 12px;margin:0;font-size:13px}
.log dt{color:var(--muted)}
.log dd{margin:0;font-variant-numeric:tabular-nums}
.meter{display:inline-block;vertical-align:middle;width:120px;height:6px;background:var(--line);border-radius:3px;margin-left:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
footer{margin:56px 0 40px;padding-top:20px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}

@media (max-width:520px){
  .brand h1{font-size:32px}
  .card{grid-template-columns:1fr;padding:18px}
  .card .mini{display:none}
}
@media (prefers-reduced-motion:reduce){button.spine{transition:none}}
</style>
</head>
<body>
<header class="site">
  <div class="wrap">
    <div class="brand"><h1>十冊の棚</h1><span class="tag">試作版</span></div>
    <p class="concept">ゼロから、面白く、視野を広げる。</p>
    <p class="lead">ひとつのテーマにつき、棚は一段、本は十冊。入門書から小説、漫画、思いがけない一冊まで並べました。十冊を読み終えるころには、そのテーマの輪郭が見えてきます。背表紙を選ぶと、解説が開きます。</p>
    <nav aria-label="棚の一覧"><ul class="index" id="index"></ul></nav>
    <div class="legend" id="legend" aria-label="背表紙の色の意味"></div>
  </div>
</header>

<main class="wrap" id="shelves"></main>

<footer class="wrap">十冊の棚（仮称）は試作版です。書名・著者名は掲載前に版元情報で確認してください。背表紙はイメージで、実際の装丁とは異なります。背表紙の高さは判型に、幅はページ数に連動させています。現在の判型とページ数はおおよその仮の値です。「選書の過程」「選書の記録」の数値は、表示イメージを確認するためのサンプル値で、実際の調査結果ではありません。</footer>

 {id:"china", name:"中国", intro:"歴史、思想、経済、現代社会、そしてSFと漫画。隣の大国を多面的に知る十冊。", books:[
  ["中国の論理", "岡本隆司", "入口", "中国のニュースを見て「なぜそう考えるのか」と戸惑ったことはないだろうか。本書は、その違和感の正体を歴史からたどる。社会が一握りの上層とその他大勢とに分かれてきたこと、自らを世界の中心に置く「中華」の発想がいまの政治や外交にまでつながっていることを、近代中国史の研究者が平易に解き明かす。個々の事件より、事件の背後にある考え方の型をつかむことに重きを置いた本だ。\nこの棚の一冊目に置いたのは、残りの九冊を読むための地図になるからだ。ここで中国の考え方の骨組みをつかんでおくと、『論語』の言葉の重みも、『八九六四』で語られる人々の沈黙も、違って見えてくる。新書一冊で読み切れる分量なのも、入口としてありがたい。", 240, "新書"],
  ["中国経済講義", "梶谷懐", "仕組み", "GDPの数字は信用できるのか、不動産バブルははじけるのか。楽観論と悲観論が極端に分かれがちな中国経済を、研究者がデータと経済学の考え方で冷静に検討する。統計の信頼性、地方政府と不動産、金融のリスクなどを一つずつ取り上げる講義形式なので、順に読めば全体像が自然と頭に入る。わかっていることと、わかっていないことを分けて示す姿勢は、ニュースの読み方の練習にもなる。\n棚では「仕組み」の枠を担う。歴史や思想の本が中国の考え方を教えてくれるなら、本書は中国がいま実際にどう動いているのかを、お金の流れから見せてくれる。数式はほとんど出てこないので、経済学になじみがなくても読める。", 260, "新書"],
  ["八九六四", "安田峰俊", "社会", "1989年の天安門事件を、当時を知る人々はどう記憶し、その後どう生きてきたのか。中国国内ではいまもほとんど語ることが許されない事件だ。著者は運動の中心にいた元学生から、国を離れた人、今は語りたがらない人まで訪ね歩き、事件への思いが立場によって大きく異なることを描き出す。英雄譚にも単純な告発にもならないところに、本書の誠実さがある。\n棚では「社会」の枠に置いた。経済成長を遂げた国で、人々は政治とどう折り合いをつけて生きているのか。統計ではなく生身の言葉で迫る一冊だ。『ワイルド・スワン』と合わせて読むと、20世紀後半の中国がより立体的に見えてくる。読後、ニュースで見る中国の人々の表情が少し違って見えるはずだ。", 320, "四六判"],
  ["物語 中国の歴史", "寺田隆信", "歴史", "殷・周から秦・漢、隋・唐、宋、元、明、そして近代の入口へ。三千年を超える歴史を新書一冊でたどる通史だ。細かな年号より、王朝が交代しても受け継がれた文字や官僚制、皇帝を中心とする統治といった、文明の骨格に光が当てられている。王朝の盛衰を物語として追えるので、歴史が苦手でも読み進めやすい。\n棚では「歴史」の枠を担う。『キングダム』の戦国の世がその後どこへ向かったのか、『論語』の思想がどう国を支えてきたのか。ほかの本で出会った時代や人物をこの一冊の年表に置き直すと、点と点がつながっていく。棚の中で、いちばん行ったり来たりしながら読みたい本だ。人物や事件を調べ直したいときの手引きにもなる。", 330, "新書"],
  ["論語", "孔子", "古典", "「学びて時に之を習う、亦た説ばしからずや」で始まる、孔子と弟子たちの言葉を、のちの人々がまとめた古典。二千年以上にわたり、日本を含む東アジアの教養の土台であり続けてきた。短い章が脈絡なく並ぶので、頭から順に読むより、気になった言葉に立ち止まり、注釈を頼りに考える読み方が向いている。孔子が理想とした「礼」や「仁」は、家族や上下関係を重んじる価値観として、いまも形を変えて生きている。\n棚では「古典」の枠に置いた。『中国の論理』が語る考え方の源流をたどると、その多くがここに行き着く。一方で、魯迅が『狂人日記』で激しく批判したのも、この教えを絶対とした古い社会だった。称える読み方と疑う読み方の両方を知ると、二千年の重みが実感できる。", 400, "文庫"],
  ["ワイルド・スワン", "ユン・チアン", "体験", "軍閥の将軍の妾となった祖母、共産党の幹部として革命に身を投じた母、紅衛兵の時代を経て英国へ渡った著者。三代の女性の人生を通して、20世紀中国の激動を描いた家族の記録だ。纏足の痛み、戦争と内戦、新しい国への期待、そして文化大革命の嵐。世界的なベストセラーになったが、中国本土では出版が認められていない。\n棚では「体験」の枠を担う。『物語 中国の歴史』が文明の大きな流れを描くなら、本書はその流れの中を生きた個人の時間を描く。教科書では数行で済む出来事の重さが、家族の目線で迫ってくる。分量は多いが、一気に読ませる力がある。『三体』の冒頭で描かれる文化大革命の場面も、読後には違って見えるはずだ。", 900, "文庫"],
  ["阿Q正伝・狂人日記", "魯迅", "物語", "仙台で医学を学んでいた魯迅は、人々の体より心を変えるべきだと考え、文学に転じた。周りの人々が自分を食べようとしていると思い込む男の日記『狂人日記』、負けても頭の中で勝ったことにしてやり過ごす男を描いた『阿Q正伝』。どちらも古い社会と人々の心のありようを鋭く突いた、近代中国文学の出発点だ。どちらも短く、百年前の作品とは思えないほど読みやすい。\n棚では「物語」の枠に置いた。『論語』に代表される伝統が、近代の入口でどれほど激しく問い直されたかを、小説として体験できる。阿Qのような人物は、いまの私たちのまわりにもいないだろうか。そう考えると、百年前の問いが現在形で響いてくる。", 250, "文庫"],
  ["三体", "劉慈欣", "物語", "文化大革命のさなか、父を殺された若い女性科学者が、極秘の研究施設で下した一つの決断。それが数十年後、人類全体の運命を揺るがしていく。英語版はアジアの作家として初めてヒューゴー賞の長編部門を受賞し、世界的なベストセラーになった長編SFだ。三部作の第一作で、続編ではさらにスケールが広がる。\n棚では「物語」の枠に置いた。物理学に裏打ちされた壮大なスケールと、謎が謎を呼ぶ展開で、現代中国のエンターテインメント小説の実力を体感できる。歴史の傷が物語の出発点になっている点にも注目したい。『ワイルド・スワン』を読んでから開くと、冒頭の場面の重みがまるで違って感じられる。", 450, "四六判"],
  ["キングダム", "原泰久", "漫画", "紀元前3世紀、七つの国が覇を競った中国の戦国時代。戦争孤児の少年・信が、のちの始皇帝である秦の若き王・嬴政と出会い、天下の大将軍を目指して戦場を駆け上がる。史書に数行しか残らない武将たちにも大胆な想像力で血を通わせ、国を一つにするとはどういうことかを問いかける歴史漫画だ。2006年に連載が始まり、アニメや実写映画にもなった。\n棚では「漫画」の枠に置いた。これほど多くの読者を中国史へ引き込んだ作品は、そう多くない。読み終えたら『物語 中国の歴史』を開き、秦の統一がその後に何を残したのかを確かめてみてほしい。物語と史実の距離を測る楽しみが生まれる。合戦の迫力と、敵味方を問わない武将たちの生き様もたっぷり味わいたい。", 200, "B6判コミック"],
  ["中華料理の文化史", "張競", "変化球", "麻婆豆腐に欠かせない唐辛子は、アメリカ大陸の原産で、中国に広まったのはそれほど古い時代ではない。私たちが知る中華料理の多くは、外からの食材や調理法を取り込みながら形づくられてきた。本書はその変化を古い文献からたどり、食卓の背後に王朝の交代や異民族との交流を浮かび上がらせる。何を食べ、どう調理してきたかという身近な問いから入るので、歴史の本としても読みやすい。\n棚では「変化球」の枠に置いた。政治や思想とは別の入口から眺めると、中国の歴史が毎日の食卓につながる話に変わる。重いテーマの多いこの棚で、肩の力を抜いて読める一冊だ。ほかの九冊の合間にはさんでほしい。読みながら何度もお腹が空くだろう。", 270, "文庫"]
 ]},

  "歴史":"長い時間軸でテーマをとらえる本の中で、刊行後も長く読まれている。",
  "古典":"刊行から長い年月を経ても読み継がれ、大学図書館での所蔵が特に多い。",
  "物語":"小説の中で、テーマとの関連度と公共図書館の所蔵数がともに高い。",
  "漫画":"漫画の中で、テーマとの関連度が高く、継続して流通している。",
  "体験":"当事者の記録の中で、公共図書館での所蔵が広い。",
  "変化球":"人の推薦枠。指標ではなく、テーマを意外な角度から照らす一冊として選んだ。"
};
const UNI_BASE = {"古典":900,"仕組み":600,"歴史":650,"社会":500,"入口":400,"体験":350,"物語":300,"漫画":60,"変化球":250};
const PUB_BASE = {"古典":700,"仕組み":500,"歴史":650,"社会":700,"入口":900,"体験":800,"物語":1100,"漫画":500,"変化球":450};
function logHTML(title,role){
  const h=hash(title);
  const uni=UNI_BASE[role]+h%300, pub=PUB_BASE[role]+(h>>4)%500;
  const score = role==="変化球" ? null : 62+(h>>8)%34;
  return `<div class="log"><h4>選書の記録<span class="sample">サンプル値</span></h4><dl>
    <dt>枠</dt><dd>${role}</dd>
    <dt>大学図書館の所蔵</dt><dd>${uni.toLocaleString()}館</dd>
    <dt>公共図書館の所蔵</dt><dd>${pub.toLocaleString()}館</dd>
    <dt>総合点</dt><dd>${score===null?"対象外（推薦枠）":`${score} / 100<span class="meter" aria-hidden="true"><i style="width:${score}%"></i></span>`}</dd>
    <dt>選ばれた理由</dt><dd>${REASON[role]}</dd>
  </dl></div>`;
}
const index = document.getElementById("index");
const legend = document.getElementById("legend");
const main = document.getElementById("shelves");

Object.entries(ROLES).forEach(([k,v])=>{
  const s=document.createElement("span");
  s.innerHTML=`<i style="background:${v.bg}"></i>${k}`;
  legend.appendChild(s);
});

SHELVES.forEach((shelf, si)=>{
  const li=document.createElement("li");
  li.innerHTML=`<a href="#${shelf.id}"><span class="no">${pad(si+1)}</span>${shelf.name}</a>`;
  index.appendChild(li);

  const ph=hash(shelf.id);
  const proc={cand:38+ph%25, ok:0}; proc.ok=proc.cand-(3+ph%7);
  const sec=document.createElement("section");
  sec.className="shelf"; sec.id=shelf.id;
  sec.innerHTML=`
    <div class="shelf-head"><span class="no">棚 ${pad(si+1)}</span><h2>${shelf.name}</h2></div>
    <p class="shelf-intro">${shelf.intro}</p>
    <p class="process"><span>選書の過程</span><b>候補 ${proc.cand}冊</b><span class="arrow">→</span><span>実在・入手性を確認</span><b>${proc.ok}冊</b><span class="arrow">→</span><span>点数化と偏り防止の条件</span><span class="arrow">→</span><b>10冊</b><span class="sample">サンプル値</span></p>
    <div class="rack"><div class="row" role="group" aria-label="${shelf.name}の棚"></div><div class="board"></div></div>
    <div class="card" aria-live="polite"></div>`;
  main.appendChild(sec);

  const row=sec.querySelector(".row");
  const card=sec.querySelector(".card");
  const spines=[];

  shelf.books.forEach((b,bi)=>{
    const [title,author,role]=b;
    const c=ROLES[role];
    const label=SHORT[title]||title;
    // 高さは判型（天地）に、幅はページ数に連動させる（判型・ページ数は仮の値）
    const fmt=b[5]||FORMAT[title], pgs=b[4]||PAGES[title];
    const h=Math.round((FORMAT_MM[fmt]||188)*1.4);
    const area=h-28;
    const pw=Math.max(26,Math.min(74,22+(pgs||300)*0.048));
    let fs=15, cols=Math.max(1,Math.floor((pw-10)/(fs*1.3)));
    while(label.length*fs*1.06>area*cols && fs>11.5){fs-=0.5; cols=Math.max(1,Math.floor((pw-10)/(fs*1.3)));}
    const need=Math.ceil(label.length*fs*1.06/area);
    const w=Math.max(pw, need*fs*1.3+10);
    const btn=document.createElement("button");
    btn.className="spine";
    btn.type="button";
    btn.style.cssText=`height:${h}px;width:${w}px;background-color:${c.bg};color:${c.fg}`;
    btn.setAttribute("aria-pressed","false");
    btn.setAttribute("aria-label",`${title}／${author}`);
    btn.innerHTML=`<span class="t" style="font-size:${fs}px">${label}</span>`;
    btn.addEventListener("click",()=>select(bi));
    row.appendChild(btn); spines.push(btn);
  });

  function select(i){
    const [title,author,role,desc,bp,bf]=shelf.books[i];
    const fmt=bf||FORMAT[title], pgs=bp||PAGES[title];
    const c=ROLES[role];
    spines.forEach((s,k)=>s.setAttribute("aria-pressed",k===i?"true":"false"));
    card.innerHTML=`
      <div class="mini" style="background:${c.bg}"></div>
      <div>
        <span class="chip" style="background:${c.bg};color:${c.fg}">${role}</span><span class="pos">${pad(i+1)} / 10</span>
        <h3>${title}</h3>
        <p class="by">${author}<span class="spec">${fmt||""}・約${pgs}ページ（仮）</span></p>
        <section class="copy" aria-label="出版社の内容紹介">
          <h4>出版社の内容紹介</h4>
          <p class="ph">ここに、版元が公開している内容紹介やキャッチコピーがそのまま入ります。本番では、openBDなどの書誌データから自動で取得して表示します。</p>
          <p class="src">出典：版元提供の書誌情報</p>
        </section>
        <h4 class="sec">十冊の棚の解説</h4>
        <div class="desc">${desc.split("\n").map(x=>`<p>${x}</p>`).join("")}</div>
        ${logHTML(title+author,role)}
        <div class="nav">
          <button type="button" data-d="-1" ${i===0?"disabled":""}>前の本</button>
          <button type="button" data-d="1" ${i===9?"disabled":""}>次の本</button>
        </div>
      </div>`;
    card.querySelectorAll(".nav button").forEach(nb=>nb.addEventListener("click",()=>{
      const n=i+Number(nb.dataset.d); select(n); spines[n].focus({preventScroll:true});
    }));
  }
  select(0);
});
</script>
</body>
</html>
